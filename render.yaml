services:
  - type: web
    name: dxti-delivery-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_CONNECTION_TIMEOUT_MS
        value: 10000
      - key: SMTP_GREETING_TIMEOUT_MS
        value: 10000
      - key: SMTP_SOCKET_TIMEOUT_MS
        value: 15000
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: TRX Logistics
      - key: EMAIL_FROM
        sync: false
      - key: REPLY_TO_EMAIL
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: CREDIXA_PAYMENT_SIGNING_SECRET_TEST
        sync: false
      - key: CREDIXA_PAYMENT_SIGNING_SECRET_PRODUCTION
        sync: false
      - key: EMAIL_LOGO_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
